services:
  barakhlo:
    image: ghcr.io/garootman/barakhlo:latest
    container_name: barakhlo
    pull_policy: always
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data
    stdin_open: true
    tty: true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 1g
